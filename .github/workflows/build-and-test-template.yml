name: Build and Test Template

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      compiler_cc:
        required: true
        type: string
      compiler_cxx:
        required: true
        type: string

jobs:
  build-and-test:
    runs-on: ${{ inputs.os }}
    defaults:
      run:
        shell: bash -el {0} # Needed for conda environment activation

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        submodules: recursive

    - name: Setup Miniforge (Conda)
      uses: conda-incubator/setup-miniconda@d2e6a045a86077fb6cad6f5adf368e9076ddaa8d # v3.1.0
      with:
        miniforge-version: latest
        use-mamba: true
        activate-environment: test-env
        python-version: "3.12"

    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y llvm-19-dev || sudo apt-get install -y llvm-18-dev

    - name: Install Conda Dependencies
      env:
        # hdmitsuba targets the OpenUSD 26.x scene-index pipeline; keep this in
        # sync with HDMITSUBA_MIN_PXR_VERSION in CMakeLists.txt.
        OPENUSD_SPEC: "openusd>=26.05,<27"
      run: |
        # Work around conda-forge openusd 26.08 Linux build where binary prefix
        # replacement pads `PXR_MATERIALX_STDLIB_DIR` with embedded NULs, causing
        # infinite recursion in `Tf_WalkDirsRec` during `SdrRegistry` discovery.
        if [ "$RUNNER_OS" = "Linux" ]; then
          OPENUSD_SPEC="openusd>=26.05,<26.08"
        fi
        # Note: conda-forge publishes `libmaterialx` for linux-64 and win-64,
        # but not yet for osx-arm64 (built and cached below on macOS).
        EXTRA_PKGS=()
        [ "$RUNNER_OS" != "macOS" ] && EXTRA_PKGS+=(libmaterialx)
        [ "$RUNNER_OS" != "Linux" ] && EXTRA_PKGS+=("llvm>=18")
        mamba install -y -c conda-forge "$OPENUSD_SPEC" openimagedenoise ninja "${EXTRA_PKGS[@]}"
        python -c "from pxr import Usd; print('OpenUSD version:', Usd.GetVersion())"

    - name: Resolve LLVM Path for DrJit
      run: |
        if [ "$RUNNER_OS" = "macOS" ]; then
          LLVM_PATH=$(find $CONDA_PREFIX/lib -name "libLLVM.dylib" | head -n 1)
          if [ -z "$LLVM_PATH" ]; then
            LLVM_PATH=$(find $CONDA_PREFIX/lib -name "libLLVM*.dylib" | sort -V | tail -n 1)
          fi
          echo "DRJIT_LIBLLVM_PATH=$LLVM_PATH" >> $GITHUB_ENV
          echo "Resolved macOS LLVM: $LLVM_PATH"
        elif [ "$RUNNER_OS" = "Windows" ]; then
          LLVM_PATH=$(find $CONDA_PREFIX/Library/bin -iname "*llvm*.dll" | sort -V | tail -n 1)
          echo "DRJIT_LIBLLVM_PATH=$LLVM_PATH" >> $GITHUB_ENV
          echo "Resolved Windows LLVM: $LLVM_PATH"
        else
          # Linux: Try system (to match Mesa), selecting the highest installed version
          LLVM_PATH=$(find /usr/lib/x86_64-linux-gnu -name "libLLVM-*.so*" | sort -V | tail -n 1)
          if [ -z "$LLVM_PATH" ]; then
            LLVM_PATH=$(find /usr/lib -name "libLLVM*.so*" | sort -V | tail -n 1)
          fi
          if [ -n "$LLVM_PATH" ]; then
            echo "DRJIT_LIBLLVM_PATH=$LLVM_PATH" >> $GITHUB_ENV
            echo "Resolved Linux LLVM: $LLVM_PATH"
          else
            echo "System LLVM not found, letting DrJit resolve it"
          fi
        fi

    - name: Install Python Dependencies
      run: |
        pip install numpy pytest pyrefly nanobind_backend pyink==26.5.1 isort==9.0.2 clang-format==23.1.5

    - name: Cache Mitsuba 3
      id: cache-mitsuba
      uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
      with:
        path: |
          third_party/mitsuba3
        key: ${{ runner.os }}-mitsuba3-aa01500f57770a4ef0b067693cae08b3e8a2ac73-spectral

    - name: Clone and Build Mitsuba 3
      if: steps.cache-mitsuba.outputs.cache-hit != 'true'
      env:
        COMPILER_CC: ${{ inputs.compiler_cc }}
        COMPILER_CXX: ${{ inputs.compiler_cxx }}
      run: |
        git clone https://github.com/mitsuba-renderer/mitsuba3.git third_party/mitsuba3
        cd third_party/mitsuba3
        git checkout aa01500f57770a4ef0b067693cae08b3e8a2ac73
        git submodule update --init --recursive
        # Configure with minimal variants to speed up build
        CMAKE_FLAGS="-DCMAKE_BUILD_TYPE=Release -DMI_ENABLE_CUDA=OFF -DMI_DEFAULT_VARIANTS=scalar_rgb,llvm_ad_rgb,llvm_ad_spectral,metal_ad_rgb -DCMAKE_POLICY_VERSION_MINIMUM=3.5"
        if [ "$RUNNER_OS" = "Windows" ]; then
          # Use default MSBuild generator on Windows (no CC/CXX overrides, no Ninja)
          cmake -B build $CMAKE_FLAGS
        else
          # Use Ninja on Linux and macOS
          if [ "$RUNNER_OS" = "Linux" ]; then
            CMAKE_FLAGS="$CMAKE_FLAGS -DMI_NATIVE_FLAGS=-march=haswell"
          fi
          CC="$COMPILER_CC" CXX="$COMPILER_CXX" cmake -B build -G Ninja \
            $CMAKE_FLAGS
        fi
        cmake --build build --config Release

    - name: Cache MaterialX (macOS)
      if: runner.os == 'macOS'
      id: cache-materialx
      uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
      with:
        path: third_party/materialx-install
        key: ${{ runner.os }}-materialx-1.39.5-stdlib

    - name: Build MaterialX (macOS)
      if: runner.os == 'macOS' && steps.cache-materialx.outputs.cache-hit != 'true'
      env:
        COMPILER_CC: ${{ inputs.compiler_cc }}
        COMPILER_CXX: ${{ inputs.compiler_cxx }}
      run: |
        curl -fsSL https://github.com/AcademySoftwareFoundation/MaterialX/archive/refs/tags/v1.39.5.tar.gz | tar xz
        CC="$COMPILER_CC" CXX="$COMPILER_CXX" cmake -S MaterialX-1.39.5 -B MaterialX-1.39.5/build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX="$PWD/third_party/materialx-install" \
          -DMATERIALX_BUILD_SHARED_LIBS=ON \
          -DMATERIALX_BUILD_GEN_MSL=OFF \
          -DMATERIALX_BUILD_GEN_GLSL=OFF \
          -DMATERIALX_BUILD_GEN_OSL=OFF \
          -DMATERIALX_BUILD_GEN_MDL=OFF \
          -DMATERIALX_BUILD_GEN_SLANG=OFF \
          -DMATERIALX_BUILD_RENDER=OFF \
          -DMATERIALX_BUILD_RENDER_PLATFORMS=OFF \
          -DMATERIALX_INSTALL_RESOURCES=OFF
        cmake --build MaterialX-1.39.5/build --target install
        # Disabling all shader generators skips `add_subdirectory(libraries)` in
        # MaterialX's CMakeLists.txt, which `MaterialXConfig.cmake` requires.
        cp -R MaterialX-1.39.5/libraries "$PWD/third_party/materialx-install/libraries"
        rm -rf MaterialX-1.39.5

    - name: Configure hdmitsuba
      env:
        COMPILER_CC: ${{ inputs.compiler_cc }}
        COMPILER_CXX: ${{ inputs.compiler_cxx }}
      run: |
        PREFIX_PATH="$CONDA_PREFIX"
        if [ "$RUNNER_OS" = "macOS" ]; then
          # Append after $CONDA_PREFIX so OpenUSD's own MaterialX wins if present.
          PREFIX_PATH="$PREFIX_PATH;$PWD/third_party/materialx-install"
        fi
        CMAKE_FLAGS="-DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=$PREFIX_PATH -DMITSUBA_DIR=$PWD/third_party/mitsuba3 -DMITSUBA_BUILD_DIR=$PWD/third_party/mitsuba3/build"
        if [ "$RUNNER_OS" = "Windows" ]; then
          # Use default MSBuild generator on Windows
          cmake -B build $CMAKE_FLAGS
        else
          # Use Ninja on Linux/macOS
          if [ "$RUNNER_OS" = "Linux" ]; then
            CMAKE_FLAGS="$CMAKE_FLAGS -DHDMITSUBA_NATIVE_FLAGS=-march=haswell"
          fi
          CC="$COMPILER_CC" CXX="$COMPILER_CXX" cmake -B build -G Ninja \
            $CMAKE_FLAGS
        fi

    - name: Build hdmitsuba
      run: |
        cmake --build build --config Release

    - name: Run Python Tests
      timeout-minutes: 10
      run: |
        source build/setpath.sh
        export PYTHONFAULTHANDLER=1
        python -c "import mitsuba; print('Mitsuba imported successfully')"
        python -c "import drjit; print('Has LLVM backend:', drjit.has_backend(drjit.JitBackend.LLVM))"
        pytest -s -vv -o faulthandler_timeout=120

    - name: Run C++ Tests
      run: |
        source build/setpath.sh
        ctest --test-dir build -C Release --output-on-failure

    - name: Run Pyrefly Type Checker
      run: |
        pyrefly check

    - name: Check Python Formatting
      run: |
        pyink --check --diff .
        isort --check-only --diff .

    - name: Check C++ Formatting
      run: |
        git ls-files '*.cc' '*.h' | xargs clang-format --dry-run --Werror

    - name: Upload macOS Crash Reports
      if: failure() && runner.os == 'macOS'
      uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
      with:
        name: macos-crash-reports
        path: ~/Library/Logs/DiagnosticReports/
